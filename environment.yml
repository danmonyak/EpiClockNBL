# Python environment for the EpiClockNBL pipeline: the EpiClockNBL package, the
# Jupyter notebooks, and the simulation scripts run on the cluster.
# Versions are pinned to those the analysis was run with (from the Anaconda
# defaults channel).
#
# Create with:   conda env create -f environment.yml
# Activate with: conda activate epiclocknbl
name: epiclocknbl
channels:
  - defaults
dependencies:
  - python=3.13.5
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.15.3
  - scikit-learn=1.6.1
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - tqdm=4.67.1
  - openpyxl=3.1.5
  - jupyterlab=4.3.4
  - ipykernel=6.29.5
