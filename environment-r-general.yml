# General R environment for the EpiClockNBL pipeline: all R code except the
# Gaussian mixture model (stages 2, 6 and 7).
# Conda provides R itself; the R packages are installed from the renv lockfile
# renv-locks/general.lock.
#
# Create with:   conda env create -f environment-r-general.yml
# Activate with: conda activate epiclocknbl-r
# Then, in R:    renv::restore(lockfile = "renv-locks/general.lock", library = .libPaths()[1], prompt = FALSE)
name: epiclocknbl-r
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.5.3
  - r-renv=1.3.1
  - pandoc=3.10
