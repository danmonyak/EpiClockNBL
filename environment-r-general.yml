# General R environment for the EpiClockNBL pipeline: all R code except the
# Gaussian mixture model (stages 2, 6 and 7).
# Conda provides R, make and pandoc, and every compiled CRAN package at the
# version in the renv lockfile renv-locks/general.lock (conda-forge keeps builds
# of old versions, so these never need compiling). renv then installs the
# remaining packages from the lockfile.
#
# Create with:   conda env create -f environment-r-general.yml
# Activate with: conda activate epiclocknbl-r
# On Windows:    conda install -c conda-forge m2-make m2-bash m2-coreutils m2-sed
# Then, from the repository directory:
#   Rscript -e "renv::restore(project = tempdir(), lockfile = 'renv-locks/general.lock', library = .libPaths()[1], prompt = FALSE)"
name: epiclocknbl-r
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.5.3
  - r-renv=1.3.1
  - make=4.4.1
  - pandoc=3.10
  # Compiled CRAN packages, at the versions in the renv lockfile. irlba, mclust and
  # quadprog are left to renv, because conda-forge's Windows builds of them fail to
  # load; the lockfile gets them from a dated Posit Package Manager snapshot.
  - r-askpass=1.2.1
  - r-base64enc=0.1_6
  - r-bit64=4.8.2
  - r-bit=4.6.0
  - r-bitops=1.0_9
  - r-cachem=1.1.0
  - r-cli=3.6.6
  - r-colorspace=2.1_2
  - r-commonmark=2.0.0
  - r-curl=7.1.0
  - r-data.table=1.18.4
  - r-digest=0.6.39
