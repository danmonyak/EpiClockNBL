  - r-farver=2.1.2
  - r-fastmap=1.2.0
  - r-filelock=1.0.3
  - r-fs=2.1.0
  - r-glmnet=5.0
  - r-glue=1.8.1
  - r-htmltools=0.5.9
  - r-httpuv=1.6.16
  - r-isoband=0.3.0
  - r-jsonlite=2.0.0
  - r-later=1.4.8
